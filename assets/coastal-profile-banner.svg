    <text x="78" y="201" fill="#c6d7dc" font-size="16" letter-spacing="1">OCEANOGRAPHY · SPATIAL ANALYSIS · MANGROVE DYNAMICS</text>
    <text x="78" y="259" fill="#79a1a8" font-size="12" letter-spacing="2">GEOTAM / UFMA  —  OPEN, REPRODUCIBLE ENVIRONMENTAL RESEARCH</text>
  </g>
