<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Felipe Martins Sousa — Oceanography and geospatial research</title>
  <desc id="desc">A dark coastal-science banner with topographic contour lines, a subtle raster grid, and mangrove silhouettes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071c24"/>
      <stop offset="0.58" stop-color="#0b2b32"/>
      <stop offset="1" stop-color="#142539"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#52e0b4"/>
      <stop offset="0.55" stop-color="#42cbd1"/>
      <stop offset="1" stop-color="#f28bb5"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#b8d6df" stroke-opacity=".07" stroke-width="1"/>
      <circle cx="1" cy="1" r="1" fill="#9edbd5" fill-opacity=".18"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="22" fill="url(#grid)"/>
  <g fill="none" stroke-width="1.4" opacity=".28">
    <path d="M620 300c20-68 84-73 113-126 33-60 8-122 75-164 36-23 82-23 130-10" stroke="#52e0b4"/>
