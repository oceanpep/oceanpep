    <path d="M720 300c17-42 60-51 80-88 24-44 17-80 56-110 31-24 67-31 108-28" stroke="#f28bb5"/>
    <path d="M0 223c91-24 143 35 234 18 73-13 102-77 174-79 48-2 77 24 127 13" stroke="#52e0b4"/>
    <path d="M0 249c91-23 141 27 225 13 75-13 108-70 179-70 52 0 76 22 131 8" stroke="#54cdd0"/>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="78" y="77" fill="#8ddfd1" font-size="13" font-weight="700" letter-spacing="3">COASTAL SCIENCE  /  GEOINFORMATION</text>
    <text x="74" y="139" fill="#f4f7f8" font-size="39" font-weight="700" letter-spacing=".4">FELIPE MARTINS SOUSA</text>
